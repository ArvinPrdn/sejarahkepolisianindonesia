<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">Mandat, layanan, dan pengawasan</title><desc id="desc">Hukum membatasi kewenangan Polri dalam memberikan layanan kepada warga. Pengawasan internal dan eksternal memeriksa pelaksanaannya. Diagram konseptual, bukan bagan komando.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#caab75"/></marker></defs><rect width="720" height="540" fill="#1b3236"/><rect x="24" y="24" width="672" height="492" fill="none" stroke="#57706a"/><text x="55" y="80" font-family="Georgia,serif" font-size="31" fill="#f2ecdf">Mandat yang dapat diperiksa.</text><text x="55" y="113" font-family="Arial,sans-serif" font-size="15" fill="#bdc8be">DIAGRAM EDITORIAL · BUKAN BAGAN KOMANDO</text><g fill="#243f42" stroke="#a89166"><rect x="54" y="170" width="170" height="125"/><rect x="276" y="170" width="170" height="125"/><rect x="498" y="170" width="170" height="125"/></g><g fill="#e7cc98" font-family="Georgia,serif" font-size="27" text-anchor="middle"><text x="139" y="215">Hukum</text><text x="361" y="215">Polri</text><text x="583" y="215">Warga</text></g><g fill="#d5ddd3" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="139" y="251">batas kewenangan</text><text x="361" y="251">pelaksanaan tugas</text><text x="583" y="251">hak atas layanan</text></g><g fill="none" stroke="#caab75" stroke-width="2" marker-end="url(#arrow)"><path d="M230 232H265"/><path d="M452 232H487"/><path d="M361 374V310" stroke-dasharray="6 5"/></g><rect x="204" y="384" width="314" height="78" fill="#243f42" stroke="#a89166"/><text x="361" y="416" font-family="Georgia,serif" font-size="24" fill="#e7cc98" text-anchor="middle">Pengawasan</text><text x="361" y="443" font-family="Arial,sans-serif" font-size="16" fill="#d5ddd3" text-anchor="middle">internal dan eksternal</text></svg>
