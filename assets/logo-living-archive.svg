<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">The Living Archive — Dari Barak ke Masyarakat</title>
  <desc id="desc">Monogram LA dalam bingkai arsip dengan wordmark The Living Archive.</desc>
  <defs>
    <style>
      .sans { font-family: 'Space Grotesk', 'Arial', sans-serif; }
      .serif { font-family: 'Playfair Display', 'Georgia', serif; }
      .mono { font-family: 'DM Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Archival frame / LA monogram -->
  <g transform="translate(32 32)">
    <rect x="0" y="0" width="356" height="356" rx="2" fill="#101e23" stroke="#caab75" stroke-width="8"/>
    <rect x="23" y="23" width="310" height="310" fill="none" stroke="#f2ecdf" stroke-opacity=".42" stroke-width="2"/>
    <path d="M52 73h70M52 73v-13M304 283h-70M304 283v13" fill="none" stroke="#caab75" stroke-width="4"/>
    <path d="M80 89v170h86M166 259l50-170 50 170M184 197h64" fill="none" stroke="#f2ecdf" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M80 286h216M80 302h128" fill="none" stroke="#caab75" stroke-opacity=".7" stroke-width="3"/>
    <path d="M80 266c27-16 57-16 86 0 29 16 59 16 86 0" fill="none" stroke="#caab75" stroke-width="4"/>
    <circle cx="286" cy="72" r="5" fill="#caab75"/>
    <text x="52" y="55" class="mono" font-size="14" letter-spacing="3" fill="#caab75">ARCHIVE / 01</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(466 92)">
    <text class="sans" x="0" y="40" font-size="31" font-weight="500" letter-spacing="7" fill="#caab75">INDEPENDENT DIGITAL EXHIBITION</text>
    <text class="sans" x="0" y="142" font-size="80" font-weight="600" letter-spacing="2" fill="#f2ecdf">THE LIVING</text>
    <text class="serif" x="0" y="226" font-size="88" font-style="italic" font-weight="500" fill="#caab75">Archive</text>
    <path d="M4 255h690" stroke="#f2ecdf" stroke-opacity=".35" stroke-width="2"/>
    <text class="mono" x="0" y="302" font-size="24" letter-spacing="4" fill="#f2ecdf">DARI BARAK KE MASYARAKAT</text>
    <text class="sans" x="0" y="350" font-size="18" letter-spacing="1.6" fill="#b9c3bd">SEJARAH · ARSIP · AKUNTABILITAS · PENGALAMAN WARGA</text>
  </g>
</svg>
